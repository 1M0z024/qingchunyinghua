<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 | 瞬间永恒</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #C4A77D;
            --primary-dark: #A68B5B;
            --secondary: #E8DFD0;
            --background: #FAF8F5;
            --text: #3D3D3D;
            --text-light: #6B6B6B;
            --white: #FFFFFF;
            --shadow: rgba(0,0,0,0.08);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 0 5%;
            transition: all 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 2px 20px var(--shadow);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 400;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .mobile-menu-btn span {
            width: 25px;
            height: 2px;
            background: var(--text);
            transition: all 0.3s ease;
        }

        /* 页面标题区域 */
        .page-header {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 5% 60px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--background) 100%);
        }

        .page-header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 4px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 600px;
        }

        /* 联系表单 */
        .contact-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 5%;
        }

        .contact-card {
            background: var(--white);
            border-radius: 16px;
            padding: 60px;
            box-shadow: 0 10px 40px var(--shadow);
        }

        .contact-card h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .contact-card p {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--secondary);
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .contact-icon {
            width: 45px;
            height: 45px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .contact-text h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: var(--text);
        }

        .contact-text p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-light);
        }

        /* 表单 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--background);
            color: var(--text);
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(196, 167, 125, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: var(--primary);
            color: var(--white);
            text-decoration: none;
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(196, 167, 125, 0.3);
        }

        /* Footer */
        footer {
            background: var(--secondary);
            padding: 60px 5% 30px;
            text-align: center;
            margin-top: 40px;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .footer-logo span {
            color: var(--primary);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .footer-copy {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 80px;
                left: 0;
                right: 0;
                background: var(--background);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
            }

            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .mobile-menu-btn.active span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .mobile-menu-btn.active span:nth-child(2) {
                opacity: 0;
            }

            .mobile-menu-btn.active span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -5px);
            }

            .page-header {
                min-height: 35vh;
                padding: 120px 5% 40px;
            }

            .contact-card {
                padding: 40px 30px;
            }

            .contact-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">瞬间<span>永恒</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="介绍.html">介绍</a></li>
                <li><a href="照片分类.html">照片分类</a></li>
                <li><a href="联系我们.html" class="active">联系我们</a></li>
            </ul>
            <div class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <section class="page-header">
        <h1>联系我们</h1>
        <p>期待与您的每一次交流</p>
    </section>

    <!-- 联系内容 -->
    <section class="contact-section">
        <div class="contact-card">
            <h2>联系方式</h2>
            <p>如果您对我们的作品感兴趣，或者有任何问题想要咨询，欢迎随时与我们联系。</p>
            
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-icon">📧</div>
                    <div class="contact-text">
                        <h3>电子邮箱</h3>
                        <p>contact@example.com</p>
                    </div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">📱</div>
                    <div class="contact-text">
                        <h3>联系电话</h3>
                        <p>123-4567-8900</p>
                    </div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">📍</div>
                    <div class="contact-text">
                        <h3>地址</h3>
                        <p>北京市朝阳区xxx路xxx号</p>
                    </div>
                </div>
            </div>

            <h3 style="margin-bottom: 20px; color: var(--text);">发送消息</h3>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">您的姓名</label>
                    <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
                </div>
                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入您的邮箱" required>
                </div>
                <div class="form-group">
                    <label for="message">留言内容</label>
                    <textarea id="message" name="message" placeholder="请输入您想说的话..." required></textarea>
                </div>
                <button type="submit" class="btn">发送消息</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">瞬间<span>永恒</span></div>
            <div class="footer-links">
                <a href="index.html">首页</a>
                <a href="介绍.html">介绍</a>
                <a href="照片分类.html">照片分类</a>
                <a href="联系我们.html">联系我们</a>
            </div>
            <p class="footer-copy">&copy; 2025 瞬间永恒 版权所有</p>
        </div>
    </footer>

    <script>
        // 导航栏滚动效果
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 移动端菜单
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');

        mobileMenuBtn.addEventListener('click', () => {
            mobileMenuBtn.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        // 表单提交
        const contactForm = document.getElementById('contactForm');
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('感谢您的留言！我们会尽快回复您。');
            contactForm.reset();
        });
    </script>
</body>
</html>
