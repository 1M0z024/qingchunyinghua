<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片分类 | 瞬间永恒</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #C4A77D;
            --primary-dark: #A68B5B;
            --secondary: #E8DFD0;
            --background: #FAF8F5;
            --text: #3D3D3D;
            --text-light: #6B6B6B;
            --white: #FFFFFF;
            --shadow: rgba(0,0,0,0.08);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 0 5%;
            transition: all 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 2px 20px var(--shadow);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 400;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .mobile-menu-btn span {
            width: 25px;
            height: 2px;
            background: var(--text);
            transition: all 0.3s ease;
        }

        /* 页面标题区域 */
        .page-header {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 5% 40px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--background) 100%);
        }

        .page-header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 4px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 600px;
        }

        /* 分类筛选 */
        .filter-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 5%;
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .filter-btn {
            padding: 12px 30px;
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* 画廊 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            aspect-ratio: 4/3;
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease;
        }

        .gallery-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item.hidden {
            display: none;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-category {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            border-radius: 15px;
            margin-bottom: 8px;
            width: fit-content;
        }

        .gallery-title {
            color: white;
            font-size: 1rem;
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-title {
            transform: translateY(0);
        }

        /* 灯箱 */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.active img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-close::before,
        .lightbox-close::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 2px;
            background: white;
        }

        .lightbox-close::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .lightbox-close::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        /* Footer */
        footer {
            background: var(--secondary);
            padding: 60px 5% 30px;
            text-align: center;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .footer-logo span {
            color: var(--primary);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .footer-copy {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 80px;
                left: 0;
                right: 0;
                background: var(--background);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
            }

            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .mobile-menu-btn.active span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .mobile-menu-btn.active span:nth-child(2) {
                opacity: 0;
            }

            .mobile-menu-btn.active span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -5px);
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }

            .filter-tabs {
                gap: 10px;
            }

            .filter-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">瞬间<span>永恒</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="介绍.html">介绍</a></li>
                <li><a href="照片分类.html" class="active">照片分类</a></li>
                <li><a href="联系我们.html">联系我们</a></li>
            </ul>
            <div class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <section class="page-header">
        <h1>照片分类</h1>
        <p>按类别浏览我们的摄影作品</p>
    </section>

    <!-- 分类筛选 -->
    <section class="filter-section">
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="landscape">风景</button>
            <button class="filter-btn" data-filter="portrait">人像</button>
            <button class="filter-btn" data-filter="life">生活</button>
            <button class="filter-btn" data-filter="nature">自然</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- 图片将由 JavaScript 动态加载 -->
        </div>
    </section>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" id="lightboxClose"></div>
        <img src="" alt="" id="lightboxImg">
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">瞬间<span>永恒</span></div>
            <div class="footer-links">
                <a href="index.html">首页</a>
                <a href="介绍.html">介绍</a>
                <a href="照片分类.html">照片分类</a>
                <a href="联系我们.html">联系我们</a>
            </div>
            <p class="footer-copy">&copy; 2025 瞬间永恒 版权所有</p>
        </div>
    </footer>

    <script>
        // 图片数据（带分类）
        const images = [
            { src: '1 (1).jpg', title: '摄影作品 1', category: 'landscape' },
            { src: '1 (5).jpg', title: '摄影作品 2', category: 'portrait' },
            { src: '1 (6).jpg', title: '摄影作品 3', category: 'life' },
            { src: '1 (7).jpg', title: '摄影作品 4', category: 'nature' },
            { src: '1 (8).jpg', title: '摄影作品 5', category: 'landscape' },
            { src: '9.jpg', title: '摄影作品 6', category: 'portrait' },
            { src: '10.png', title: '摄影作品 7', category: 'life' },
            { src: '13.png', title: '摄影作品 8', category: 'nature' },
            { src: '14.jpg', title: '摄影作品 9', category: 'landscape' },
            { src: '15.jpg', title: '摄影作品 10', category: 'portrait' },
            { src: '17.jpg', title: '摄影作品 11', category: 'life' },
            { src: '18.jpg', title: '摄影作品 12', category: 'nature' },
            { src: '19.jpg', title: '摄影作品 13', category: 'landscape' },
            { src: '20.jpg', title: '摄影作品 14', category: 'portrait' },
            { src: '21.jpg', title: '摄影作品 15', category: 'life' },
            { src: '22.jpg', title: '摄影作品 16', category: 'nature' },
            { src: 'IMG_8078.JPG', title: '摄影作品 17', category: 'landscape' },
            { src: '1 (1).png', title: '摄影作品 18', category: 'portrait' }
        ];

        const categoryNames = {
            landscape: '风景',
            portrait: '人像',
            life: '生活',
            nature: '自然'
        };

        // 生成画廊
        const galleryGrid = document.getElementById('galleryGrid');
        images.forEach((img, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.dataset.category = img.category;
            item.innerHTML = `
                <img src="${img.src}" alt="${img.title}" loading="lazy">
                <div class="gallery-overlay">
                    <span class="gallery-category">${categoryNames[img.category]}</span>
                    <span class="gallery-title">${img.title}</span>
                </div>
            `;
            item.addEventListener('click', () => openLightbox(img.src));
            galleryGrid.appendChild(item);
        });

        // 滚动动画
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.gallery-item').forEach(item => {
            observer.observe(item);
        });

        // 筛选功能
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 更新按钮状态
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filter = btn.dataset.filter;

                // 筛选图片
                galleryItems.forEach(item => {
                    if (filter === 'all' || item.dataset.category === filter) {
                        item.classList.remove('hidden');
                        setTimeout(() => {
                            item.classList.add('visible');
                        }, 50);
                    } else {
                        item.classList.remove('visible');
                        setTimeout(() => {
                            item.classList.add('hidden');
                        }, 300);
                    }
                });
            });
        });

        // 导航栏滚动效果
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 移动端菜单
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');

        mobileMenuBtn.addEventListener('click', () => {
            mobileMenuBtn.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        // 灯箱功能
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
